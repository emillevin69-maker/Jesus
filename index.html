<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Библейская Викторина</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #2b1d0c;
      --card-bg: #4a3525;
      --accent-color: #e2b041;
      --text-color: #f7e8d0;
      --btn-bg: #8c5d35;
      --correct-color: #488b49;
      --wrong-color: #a83232;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Press Start 2P', monospace;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden; font-size: 10px;
    }

    .nav-bar {
      display: flex; background-color: #1a1005;
      border-bottom: 4px solid var(--accent-color);
    }

    .nav-btn {
      flex: 1; padding: 12px 5px; background: none; border: none;
      color: var(--text-color); font-family: 'Press Start 2P', monospace;
      font-size: 8px; cursor: pointer; text-align: center;
    }

    .nav-btn.active { background-color: var(--accent-color); color: #000; }

    .content-area {
      flex: 1; padding: 15px; overflow-y: auto;
      display: flex; flex-direction: column;
    }

    .tab-content { display: none; height: 100%; flex-direction: column; }
    .tab-content.active { display: flex; }

    .stats-card {
      background-color: var(--card-bg);
      border: 4px solid var(--accent-color);
      padding: 10px; margin-bottom: 15px;
      display: flex; justify-content: space-between;
      box-shadow: 4px 4px 0 #000;
    }

    .question-card {
      background-color: var(--card-bg);
      border: 4px solid #fff;
      padding: 15px; margin-bottom: 15px;
      line-height: 1.6; text-align: center;
      min-height: 110px; display: flex;
      align-items: center; justify-content: center;
      box-shadow: 4px 4px 0 #000;
    }

    .options-container { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      background-color: var(--btn-bg);
      color: var(--text-color);
      border: 3px solid #000; padding: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px; cursor: pointer; text-align: left;
      line-height: 1.4; box-shadow: 3px 3px 0 #000;
    }

    .option-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    .option-btn.correct { background-color: var(--correct-color) !important; }
    .option-btn.wrong { background-color: var(--wrong-color) !important; }

    .leaderboard-list { display: flex; flex-direction: column; gap: 8px; }

    .leader-item {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      padding: 8px; display: flex;
      align-items: center; justify-content: space-between;
    }

    .leader-item.top3 { border: 3px solid #ff2200; background-color: #5c3e1e; }
    .leader-item.me { border: 3px solid #00ffcc; }

    .user-info { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 24px; height: 24px; background-color: #aaa;
      border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-size: 8px; color: #000;
    }

    .achievements-grid { display: flex; flex-direction: column; gap: 10px; }
    .achievement-card {
      background-color: var(--card-bg);
      border: 2px solid #666; padding: 10px; opacity: 0.5;
    }
    .achievement-card.unlocked { border-color: var(--accent-color); opacity: 1.0; }
    .ach-title { color: var(--accent-color); margin-bottom: 5px; }
    .ach-desc { font-size: 8px; color: #ccc; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('game')">🎮 Игра</button>
    <button class="nav-btn" onclick="switchTab('leaderboard')">🏆 Топ 20</button>
    <button class="nav-btn" onclick="switchTab('achievements')">🏅 Награды</button>
  </div>

  <div class="content-area">
    <!-- ИГРА -->
    <div id="tab-game" class="tab-content active">
      <div class="stats-card">
        <div>Уровень: <span id="player-level" style="color: var(--accent-color);">1</span></div>
        <div>MMR: <span id="player-mmr" style="color: #00ffcc;">1000</span></div>
      </div>

      <div class="question-card" id="question-text">Загрузка данных...</div>
      <div class="options-container" id="options-box"></div>
    </div>

    <!-- ТОП 20 -->
    <div id="tab-leaderboard" class="tab-content">
      <div class="leaderboard-list" id="leaderboard-box"></div>
    </div>

    <!-- ДОСТИЖЕНИЯ -->
    <div id="tab-achievements" class="tab-content">
      <div class="achievements-grid" id="achievements-box"></div>
    </div>
  </div>

  <script>
    // TELEGRAM
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const tgUser = tg?.initDataUnsafe?.user;
    const currentUser = {
      id: tgUser?.id ? String(tgUser.id) : "user_guest",
      name: tgUser ? `${tgUser.first_name || 'Игрок'} ${tgUser.username ? '(@' + tgUser.username + ')' : ''}` : "Паломник"
    };

    // ТВОЯ ЕВРОПЕЙСКАЯ БАЗА FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCHSzZdY7gC5Xrv_by0oNGSGUqZANwGqig",
      authDomain: "bible-quiz-app-6c6c4.firebaseapp.com",
      databaseURL: "https://bible-quiz-app-6c6c4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bible-quiz-app-6c6c4",
      storageBucket: "bible-quiz-app-6c6c4.firebasestorage.app",
      messagingSenderId: "604500555364",
      appId: "1:604500555364:web:b6530203d20566e0e91171"
    };

    let database = null;
    try {
      firebase.initializeApp(firebaseConfig);
      database = firebase.database();
    } catch (e) {
      console.warn("Ошибка Firebase:", e);
    }

    // STATE
    let state = { level: 1, mmr: 1000, mistakesOnCurrent: 0, startTime: 0 };
    let isGameStarted = false;

    const questionsDatabase = {
      easy: [
        { id: "e1", q: "Кто построил ковчег?", options: ["Ной", "Авраам", "Моисей"], correct: 0 },
        { id: "e2", q: "Сколько дней Бог сотворял мир?", options: ["5", "6", "7"], correct: 1 },
        { id: "e3", q: "Как называлась первая книга Библии?", options: ["Исход", "Бытие", "Левит"], correct: 1 },
        { id: "e4", q: "Кто победил Голиафа пращой и камнем?", options: ["Саул", "Давид", "Соломон"], correct: 1 },
        { id: "e5", q: "Какое море расступилось перед Моисеем?", options: ["Красное", "Мертвое", "Средиземное"], correct: 0 },
        { id: "e6", q: "В каком городе родился Иисус Христос?", options: ["Назарет", "Иерусалим", "Вифлеем"], correct: 2 },
        { id: "e7", q: "Кто был сброшен в ров со львами за молитву?", options: ["Даниил", "Иона", "Самсон"], correct: 0 },
        { id: "e8", q: "Какая птица принесла Ною масличный лист?", options: ["Ворон", "Голубь", "Орел"], correct: 1 }
      ],
      medium: [
        { id: "m1", q: "Сколько апостолов было у Иисуса?", options: ["10", "12", "70"], correct: 1 },
        { id: "m2", q: "Кто пробыл во чреве кита 3 дня и 3 ночи?", options: ["Иона", "Даниил", "Илия"], correct: 0 },
        { id: "m3", q: "На какой горе Моисей получил Десять Заповедей?", options: ["Елеонская", "Синай", "Арарат"], correct: 1 },
        { id: "m4", q: "Кто обладал невероятной силой, заключенной в волосах?", options: ["Гедеон", "Самсон", "Саул"], correct: 1 },
        { id: "m5", q: "Сколько дней Иисус постился в пустыне?", options: ["30", "40", "50"], correct: 1 },
        { id: "m6", q: "Кого Иисус воскресил на четвёртый день после смерти?", options: ["Лазаря", "Иаира", "Стефана"], correct: 0 },
        { id: "m7", q: "Кто продал своё первородство за чечевичную похлебку?", options: ["Исав", "Иаков", "Иосиф"], correct: 0 },
        { id: "m8", q: "На какой горе остановился Ноев ковчег?", options: ["Синай", "Фавор", "Арарат"], correct: 2 }
      ],
      hard: [
        { id: "h1", q: "Кто заменил Иуду Искариота среди 12-ти апостолов?", options: ["Матфий", "Павел", "Варнава"], correct: 0 },
        { id: "h2", q: "Сколько книг в Ветхом Завете (каноническом)?", options: ["27", "39", "66"], correct: 1 },
        { id: "h3", q: "Кто был самым первым царем Израиля?", options: ["Давид", "Соломон", "Саул"], correct: 2 },
        { id: "h4", q: "Какой апостол по профессии был врачом?", options: ["Матфей", "Лука", "Марк"], correct: 1 },
        { id: "h5", q: "Как называлось место, где Авраам должен был принести в жертву Исаака?", options: ["Гора Мориа", "Голгофа", "Вефиль"], correct: 0 },
        { id: "h6", q: "Сколько лет израильтяне блуждали по пустыне?", options: ["20", "40", "70"], correct: 1 },
        { id: "h7", q: "Кто был самым долгоживущим человеком в Библии (969 лет)?", options: ["Мафусал", "Адам", "Ной"], correct: 0 },
        { id: "h8", q: "Как назывался первый христианский мученик, побитый камнями?", options: ["Иаков", "Стефан", "Филипп"], correct: 1 }
      ]
    };

    const achievements = [
      { lvl: 10, title: "Ученик", desc: "Достигните 10 уровня" },
      { lvl: 25, title: "Чтец", desc: "Достигните 25 уровня" },
      { lvl: 50, title: "Знаток Писания", desc: "Достигните 50 уровня" },
      { lvl: 100, title: "Богослов", desc: "Достигните 100 уровня" },
      { lvl: 150, title: "Патриарх", desc: "Достигните 150 уровня" }
    ];

    let queues = { easy: [], medium: [], hard: [] };

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getNextQuestion(difficulty) {
      if (!queues[difficulty] || queues[difficulty].length === 0) {
        queues[difficulty] = shuffleArray(questionsDatabase[difficulty]);
      }
      return queues[difficulty].pop();
    }

    let currentQuestionObj = null;

    function loadUserProgress() {
      const localData = localStorage.getItem('quiz_progress_' + currentUser.id);
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          state.level = parsed.level || 1;
          state.mmr = parsed.mmr || 1000;
        } catch(e) {}
      }

      if (database) {
        let dbLoaded = false;
        database.ref('players/' + currentUser.id).once('value')
          .then((snapshot) => {
            dbLoaded = true;
            if (snapshot.exists()) {
              const data = snapshot.val();
              state.level = data.level || state.level;
              state.mmr = data.mmr || state.mmr;
            }
            startGame();
          })
          .catch(() => { if (!dbLoaded) startGame(); });

        setTimeout(() => { if (!dbLoaded) startGame(); }, 1200);
      } else {
        startGame();
      }
    }

    function saveProgressToCloud() {
      localStorage.setItem('quiz_progress_' + currentUser.id, JSON.stringify({
        level: state.level,
        mmr: state.mmr
      }));

      if (database) {
        database.ref('players/' + currentUser.id).set({
          id: currentUser.id,
          name: currentUser.name,
          mmr: state.mmr,
          level: state.level,
          updatedAt: Date.now()
        }).catch((err) => console.log("Ошибка сохранения в БД:", err));
      }
    }

    function startGame() {
      if (isGameStarted) return;
      isGameStarted = true;
      loadQuestion();
      renderAchievements();
      saveProgressToCloud();
    }

    function getDifficultyByLevel(level) {
      if (level <= 15) return 'easy';
      if (level <= 40) return 'medium';
      return 'hard';
    }

    function loadQuestion() {
      const diff = getDifficultyByLevel(state.level);
      currentQuestionObj = getNextQuestion(diff);

      state.mistakesOnCurrent = 0;
      state.startTime = Date.now();

      document.getElementById('question-text').innerText = currentQuestionObj.q;
      
      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      currentQuestionObj.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => handleAnswer(idx, btn);
        optionsBox.appendChild(btn);
      });

      updateUI();
    }

    function handleAnswer(selectedIndex, btnElement) {
      const allButtons = document.querySelectorAll('.option-btn');

      if (selectedIndex === currentQuestionObj.correct) {
        btnElement.classList.add('correct');
        allButtons.forEach(b => b.disabled = true);
        
        const timeSpent = (Date.now() - state.startTime) / 1000;
        let speedBonus = Math.max(0, Math.floor(20 - timeSpent));
        let penalty = state.mistakesOnCurrent * 15;
        
        let earnedMMR = Math.max(5, 25 + speedBonus - penalty);
        state.mmr += earnedMMR;
        state.level += 1;

        saveProgressToCloud();
        setTimeout(() => { loadQuestion(); }, 800);

      } else {
        btnElement.classList.add('wrong');
        btnElement.disabled = true;
        
        state.mistakesOnCurrent += 1;
        state.mmr = Math.max(0, state.mmr - 10);
        
        saveProgressToCloud();
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('player-level').innerText = state.level;
      document.getElementById('player-mmr').innerText = state.mmr;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      
      const btnIndex = tabName === 'game' ? 0 : tabName === 'leaderboard' ? 1 : 2;
      document.querySelectorAll('.nav-btn')[btnIndex].classList.add('active');

      if (tabName === 'leaderboard') renderLeaderboard();
      else if (tabName === 'achievements') renderAchievements();
    }

    function renderLeaderboard() {
      const box = document.getElementById('leaderboard-box');
      box.innerHTML = '<div style="text-align:center; padding: 20px;">Загрузка топа...</div>';

      if (!database) {
        box.innerHTML = '<div style="text-align:center; padding: 20px;">Firebase недоступен.</div>';
        return;
      }

      database.ref('players').once('value')
        .then((snapshot) => {
          box.innerHTML = '';
          let players = [];
          
          if (snapshot.exists()) {
            snapshot.forEach((child) => { players.push(child.val()); });
          }

          players.sort((a, b) => (b.mmr || 0) - (a.mmr || 0));
          const top20 = players.slice(0, 20);

          if (top20.length === 0) {
            box.innerHTML = '<div style="text-align:center; padding: 20px;">Пока нет игроков в топе.<br><br>Ответьте на один вопрос, чтобы записаться в базу!</div>';
            return;
          }

          top20.forEach((item, index) => {
            const isMe = String(item.id) === String(currentUser.id);
            const div = document.createElement('div');
            let classes = 'leader-item';
            if (index < 3) classes += ' top3';
            if (isMe) classes += ' me';

            div.className = classes;
            div.innerHTML = `
              <div class="user-info">
                <span>#${index + 1}</span>
                <div class="avatar">${item.name ? item.name[0] : '?'}</div>
                <div>
                  <div>${item.name || 'Игрок'}</div>
                  <div style="font-size:7px; color:#aaa;">Ур. ${item.level || 1}</div>
                </div>
              </div>
              <div style="color: #00ffcc;">${item.mmr || 0} MMR</div>
            `;
            box.appendChild(div);
          });
        })
        .catch((err) => {
          box.innerHTML = `<div style="text-align:center; padding: 20px;"> Ошибка доступа к БД.<br><br><span style="font-size:7px; color:#ff8888;">${err.message}</span></div>`;
        });
    }

    function renderAchievements() {
      const box = document.getElementById('achievements-box');
      box.innerHTML = '';

      achievements.forEach(ach => {
        const isUnlocked = state.level >= ach.lvl;
        const div = document.createElement('div');
        div.className = `achievement-card ${isUnlocked ? 'unlocked' : ''}`;
        div.innerHTML = `
          <div class="ach-title">${isUnlocked ? '🏆' : '🔒'} ${ach.title}</div>
          <div class="ach-desc">${ach.desc}</div>
        `;
        box.appendChild(div);
      });
    }

    loadUserProgress();
  </script>
</body>
</html>
